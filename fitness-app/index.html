<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Calorie tracker and 12-week kettlebell + bodyweight training program.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Bell &amp; Fork</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Bell &amp; Fork</h1>
    <span class="topbar-sub" id="topbar-sub"></span>
  </header>

  <main id="main" class="main" tabindex="-1"></main>

  <div id="rest-bar" class="rest-bar" hidden>
    <span>Rest</span>
    <strong id="rest-time">0:00</strong>
    <button type="button" class="btn btn-small btn-ghost" data-action="rest-skip">Skip</button>
  </div>

  <nav class="tabs" id="tabs" aria-label="Main">
    <button type="button" data-view="today"><span class="tab-icon" aria-hidden="true">◎</span>Today</button>
    <button type="button" data-view="food"><span class="tab-icon" aria-hidden="true">🍽</span>Food</button>
    <button type="button" data-view="train"><span class="tab-icon" aria-hidden="true">🏋</span>Train</button>
    <button type="button" data-view="progress"><span class="tab-icon" aria-hidden="true">📈</span>Progress</button>
    <button type="button" data-view="profile"><span class="tab-icon" aria-hidden="true">⚙</span>Profile</button>
  </nav>

  <dialog id="modal" class="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/calc.js"></script>
  <script src="js/foods.js"></script>
  <script src="js/program.js"></script>
  <script src="js/demos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
